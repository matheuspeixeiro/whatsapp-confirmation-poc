<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Confirmação de chegada</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      color: #1f2937;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 24px 16px;
    }

    .card {
      width: 100%;
      max-width: 460px;
      background: white;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 24px;
    }

    .subtitle {
      margin: 0 0 24px;
      color: #6b7280;
      font-size: 15px;
    }

    .order {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px;
      margin-bottom: 12px;
      border: 1px solid #d1d5db;
      border-radius: 14px;
      cursor: pointer;
      font-size: 17px;
      background: #fff;
    }

    .order input {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
    }

    .order-code {
      font-weight: 700;
    }

    .order-name {
      color: #4b5563;
      margin-top: 3px;
      font-size: 14px;
    }

    .quick-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 18px;
    }

    button {
      min-height: 48px;
      border-radius: 12px;
      border: 0;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    .secondary {
      background: #e5e7eb;
      color: #1f2937;
    }

    .primary {
      width: 100%;
      margin-top: 18px;
      background: #111827;
      color: white;
    }

    .success {
      display: none;
      text-align: center;
      padding: 28px 8px;
    }

    .success-icon {
      font-size: 56px;
      margin-bottom: 12px;
    }

    .success h2 {
      margin-bottom: 8px;
    }

    .success p {
      color: #6b7280;
    }
  </style>
</head>

<body>
  <main class="card">
    <section id="form">
      <h1>📦 Quais pedidos chegaram?</h1>

      <p class="subtitle">
        Selecione somente os pedidos que chegaram ao Hub.
      </p>

      <label class="order">
        <input type="checkbox" class="order-checkbox" value="6321" />
        <div>
          <div class="order-code">Pedido 6321</div>
          <div class="order-name">MR PRETZELS</div>
        </div>
      </label>

      <label class="order">
        <input type="checkbox" class="order-checkbox" value="8827" />
        <div>
          <div class="order-code">Pedido 8827</div>
          <div class="order-name">NESPRESSO</div>
        </div>
      </label>

      <div class="quick-actions">
        <button class="secondary" onclick="selectAll()">
          ✅ Todos
        </button>

        <button class="secondary" onclick="selectNone()">
          ❌ Nenhum
        </button>
      </div>

      <button class="primary" onclick="confirmOrders()">
        Confirmar
      </button>
    </section>

    <section id="success" class="success">
      <div class="success-icon">✅</div>
      <h2>Confirmação registrada</h2>
      <p>Você pode fechar esta tela.</p>
    </section>
  </main>

  <script>
    function selectAll() {
      document
        .querySelectorAll(".order-checkbox")
        .forEach((checkbox) => checkbox.checked = true);
    }

    function selectNone() {
      document
        .querySelectorAll(".order-checkbox")
        .forEach((checkbox) => checkbox.checked = false);
    }

    function confirmOrders() {
      const selected = Array
        .from(document.querySelectorAll(".order-checkbox:checked"))
        .map((checkbox) => checkbox.value);

      console.log("Pedidos confirmados:", selected);

      document.getElementById("form").style.display = "none";
      document.getElementById("success").style.display = "block";
    }
  </script>
</body>
</html>
